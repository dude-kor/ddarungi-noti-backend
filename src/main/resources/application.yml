spring:
  application:
    name: ddarungi-noti
  config:
    # Secrets are never committed. Local runs (`./gradlew bootRun`) read them from ./.env (gitignored, copy
    # .env.example); containers and servers get them as real environment variables. Missing file = skipped.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads for Tomcat + @Async/@Scheduled executors
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ddarungi_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    # Defaults are the local docker-compose values only; override them via .env / environment in any real deployment.
    username: ${MYSQL_USER:ddarungi}
    password: ${MYSQL_PASSWORD:ddarungi}
  jpa:
    open-in-view: false
    hibernate:
      # FIX: schema is owned by Flyway (db/migration/V1__init.sql). `update` could never alter indexes or add CHECKs
      #      and drifted per environment. `none` rather than `validate`: several columns use columnDefinition
      #      (TINYINT) that Hibernate's validator reports as a type mismatch.
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing dev database created by the old ddl-auto=update has no history table: recreate it
    # (`docker compose down -v`) instead of baselining, otherwise it keeps the old unique/index layout.
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}       # empty = no AUTH (local Redis has none)

server:
  port: 8080
  shutdown: graceful

# Redisson reads this via spring.data.redis.* automatically (redisson-spring-boot-starter)

seoul-api:
  base-url: ${SEOUL_API_BASE_URL:http://localhost:8089}   # real: http://openapi.seoul.go.kr:8088
  key: ${SEOUL_API_KEY:LOCAL_KEY}                          # WireMock: ERROR_KEY / SLOW_KEY simulate failures
  chunk-size: 1000
  max-stations: 3000
  connect-timeout: 2s
  read-timeout: 3s

cache:
  station-realtime-ttl: 60s

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

resilience4j:
  circuitbreaker:
    instances:
      seoulApi:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  level:
    kr.ddarungi: DEBUG
