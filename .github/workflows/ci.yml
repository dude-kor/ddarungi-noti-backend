name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: |
          chmod +x gradlew      # the executable bit is lost when files travel through some zip tools
          ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 7

  validate-infra:
    name: Validate compose & WireMock mappings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose --profile app config --quiet

      - name: WireMock mappings are valid JSON
        run: |
          for f in wiremock/mappings/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
